version: 2

# Actions were floating on mutable tags and nothing watched the pinned
# requirements, so a CI break or an advisory arrived only when something else
# happened to fail. Monthly keeps the noise low enough to actually read.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

    # Dependabot's 4.2.0 pull request is GREEN here, and that is the reason to
    # be careful rather than a reason to merge it.
    #
    # Spark 4 turns ANSI mode on by default: casting a malformed string to a
    # number now raises CAST_INVALID_INPUT instead of producing NULL. The
    # sibling repository, Million-Song-Dataset-Analysis-with-Spark, has a test
    # that feeds a bad value and it went red on exactly that. This repository
    # uses the same idiom -- latitude, longitude, elevation_m, first_year and
    # last_year are all cast out of a fixed-width text file -- and no test here
    # feeds a malformed field, so nothing exercises it. The suite passing on
    # Spark 4 says the tests do not reach the change, not that the change is
    # harmless.
    #
    # And the published figures were computed on 3.5.9 against the real
    # extract, which CI never re-derives. Accepting Spark 4 means re-running
    # the analysis and comparing, which is deliberate work rather than a merged
    # bump.
    #
    # Major only. A 3.5.x release still arrives, which is where a fix would
    # come from.
    ignore:
      - dependency-name: pyspark
        update-types: ["version-update:semver-major"]
